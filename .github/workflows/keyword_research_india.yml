name: Keyword Research India (on demand)

on:
  workflow_dispatch:
    inputs:
      seed_keywords:
        description: 'Comma-separated keywords (blank = built-in NISM list)'
        required: false
        default: ''
  push:
    branches: [nism-keyword-research]
    paths: [nism_keyword_research.py, .github/workflows/keyword_research_india.yml]

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install google-ads pandas
      - name: Run Keyword Planner research
        env:
          GADS_CLIENT_ID: ${{ secrets.GADS_CLIENT_ID }}
          GADS_CLIENT_SECRET: ${{ secrets.GADS_CLIENT_SECRET }}
          GADS_REFRESH_TOKEN: ${{ secrets.GADS_REFRESH_TOKEN }}
          GADS_LOGIN_CUSTOMER_ID: ${{ secrets.GADS_LOGIN_CUSTOMER_ID }}
          SEED_KEYWORDS: ${{ github.event.inputs.seed_keywords }}
        run: python nism_keyword_research.py
      - uses: actions/upload-artifact@v4
        with:
          name: keyword-research-india
          path: |
            keyword_research.csv
            keyword_ideas.csv
