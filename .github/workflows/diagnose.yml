name: Diagnostic Test Suite

on:
  workflow_dispatch:

jobs:
  run-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Virtual Display
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          python -m pip install --upgrade pip
          pip install playwright pandas
          playwright install chromium

      - name: Run Diagnostics (Headed in Virtual Framebuffer)
        run: xvfb-run --auto-servernum python test_scraper.py

      - name: Save Debug Screenshot Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: debug_viewport.png
