name: Structure Google Ads & Landing Pages

on:
  workflow_dispatch: # Allows you to manually trigger this standalone structuring job anytime

jobs:
  run-structuring:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Run Ad Structuring Script
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python structure_ads.py

      - name: Upload Structured Ads Artifact
        uses: actions/upload-artifact@v4
        with:
          name: google-ads-structured-import
          path: google_ads_final_ready_import.csv

      - name: Commit and Push Structured Import File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add google_ads_final_ready_import.csv
          git commit -m "Auto-generated Google Ads structured import and Next.js routing file" || exit 0
          git push
