name: Daily Marketcall Scraper

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & XVFB
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          python -m pip install --upgrade pip
          pip install playwright pandas google-cloud-bigquery pyarrow
          playwright install chromium

      - name: Set up GCP Credentials
        run: |
          echo '${{ secrets.GCP_SA_BQ_KEY }}' > gcp_key.json

      - name: Run Scraper in Virtual Framebuffer
        run: xvfb-run --auto-servernum python scraper.py
