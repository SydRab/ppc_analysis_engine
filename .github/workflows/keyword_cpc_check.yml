name: Keyword CPC Check (on demand)

on:
  workflow_dispatch:
    inputs:
      extra_keywords:
        description: 'Optional comma-separated keywords to check that are not in the campaign'
        required: false
        default: ''

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install google-ads pandas
      - name: Run Keyword Planner check
        env:
          GADS_CLIENT_ID: ${{ secrets.GADS_CLIENT_ID }}
          GADS_CLIENT_SECRET: ${{ secrets.GADS_CLIENT_SECRET }}
          GADS_REFRESH_TOKEN: ${{ secrets.GADS_REFRESH_TOKEN }}
          GADS_LOGIN_CUSTOMER_ID: ${{ secrets.GADS_LOGIN_CUSTOMER_ID }}
          EXTRA_KEYWORDS: ${{ github.event.inputs.extra_keywords }}
        run: python keyword_cpc_check.py
      - uses: actions/upload-artifact@v4
        with:
          name: keyword-cpc-check
          path: keyword_cpc_check.csv
