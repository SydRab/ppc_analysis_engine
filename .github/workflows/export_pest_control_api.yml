name: Export Pest Control API Metrics

on:
  workflow_dispatch:  # Allows manual triggering from the GitHub Actions tab

jobs:
  run-export:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-ads google-cloud-bigquery pandas numpy

      - name: Run Pest Control API Script
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_SA_KEY_JSON: ${{ secrets.GCP_SA_KEY_JSON }}
          GADS_CLIENT_ID: ${{ secrets.GADS_CLIENT_ID }}
          GADS_CLIENT_SECRET: ${{ secrets.GADS_CLIENT_SECRET }}
          GADS_REFRESH_TOKEN: ${{ secrets.GADS_REFRESH_TOKEN }}
          GADS_LOGIN_CUSTOMER_ID: ${{ secrets.GADS_LOGIN_CUSTOMER_ID }}
        run: |
          python export_pest_control_csv.py

      - name: Upload CSV Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pest-control-api-output
          path: pest_control_api_raw_output.csv
